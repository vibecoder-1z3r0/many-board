<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Many Board</title>
  <style>
    :root {
      --bg:          #1a1a2e;
      --panel:       #16213e;
      --border:      #0f3460;
      --border-mid:  #2a2a3e;
      --border-dark: #333;
      --input-bg:    #111;
      --accent:      #e94560;
      --accent-dark: #c0392b;
      --text:        #e0e0e0;
      --text-dim:    #888;
      --text-dimmer: #555;
      --text-bright: #fff;
      --highlight:   #4fc3f7;
    }
    [data-theme="stadium"] {
      --bg:          #000000;
      --panel:       #0d0d0d;
      --border:      #2a2a2a;
      --border-mid:  #1f1f1f;
      --border-dark: #1a1a1a;
      --input-bg:    #111111;
      --accent:      #00e5ff;
      --accent-dark: #00b8cc;
      --text:        #ffffff;
      --text-dim:    #aaaaaa;
      --text-dimmer: #666666;
      --text-bright: #ffffff;
      --highlight:   #ffeb3b;
    }
    [data-theme="field"] {
      --bg:          #0a1a0a;
      --panel:       #0f200f;
      --border:      #1e4d1e;
      --border-mid:  #162816;
      --border-dark: #1e3a1e;
      --input-bg:    #071207;
      --accent:      #f5a623;
      --accent-dark: #d4891a;
      --text:        #e8f0e8;
      --text-dim:    #7a9e7a;
      --text-dimmer: #4a6a4a;
      --text-bright: #ffffff;
      --highlight:   #7dff8a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 48px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand { font-size: 18px; font-weight: 700; color: var(--accent); }

    .theme-select {
      background: var(--input-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-dark);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .theme-select:focus { border-color: var(--accent); color: var(--text); }

    main { flex: 1; padding: 24px; max-width: 960px; }

    .section-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }

    .card {
      background: var(--bg);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.15s;
      min-width: 240px;
      flex: 1 1 240px;
      max-width: 320px;
    }
    .card:hover { border-color: var(--text-dimmer); }

    .card-sport {
      font-size: 11px;
      color: var(--text-dimmer);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
    }
    .dot-active { background: #3498db; animation: pulse 1s ease-in-out infinite; }
    .dot-final  { background: #666; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Mini box score table */
    .box-table {
      width: 100%;
      border-collapse: collapse;
      font-family: monospace;
      margin-bottom: 10px;
    }
    .box-table th {
      font-size: 10px;
      color: var(--text-dimmer);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      padding: 3px 6px;
      border-bottom: 1px solid var(--border-mid);
    }
    .box-table th.team-h { text-align: left; }
    .box-table td {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dim);
      text-align: center;
      padding: 5px 6px;
    }
    .box-table td.team-h {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .box-table td.team-h.poss { color: var(--accent); }
    .box-table td.total-h {
      font-size: 22px;
      color: var(--text-bright);
      border-left: 1px solid var(--border-mid);
      padding: 5px 10px;
    }
    .box-table td.active-h { color: var(--highlight); }
    .box-table td.empty-h  { color: var(--border-mid); }

    .card-state {
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
    }

    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-dark);
      background: transparent;
      color: var(--text-dim);
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger:hover { border-color: var(--accent-dark); color: var(--accent-dark); }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--accent-dark); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 24px;
      width: 440px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .modal-title { font-size: 16px; color: var(--accent); font-weight: 700; margin-bottom: 20px; }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input, select {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border-dark);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .empty-state { color: var(--text-dimmer); font-size: 14px; padding: 12px 0; }

    .hint { font-size: 11px; color: var(--text-dimmer); margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">MANY BOARD</span>
    <select id="theme-select" class="theme-select" onchange="applyTheme(this.value)" style="margin-left:auto;width:150px" title="Switch theme">
      <option value="default">Default</option>
      <option value="stadium">Stadium</option>
      <option value="field">Field</option>
    </select>
  </header>

  <main>
    <div class="section-header">
      <span>Games</span>
      <button class="btn-primary" onclick="openModal()">+ New Game</button>
    </div>
    <div class="card-grid" id="games-list">
      <div class="empty-state">Loading...</div>
    </div>
  </main>

  <!-- Create Game Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title">New Game</div>

      <div class="form-group">
        <label>Sport</label>
        <select id="sport-select" onchange="updateSportFields()">
          <option value="football">Flag Football</option>
          <option value="baseball">Baseball / Wiffleball</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Home Team</label>
          <input id="home-team" type="text" placeholder="Home" maxlength="20">
        </div>
        <div class="form-group">
          <label>Away Team</label>
          <input id="away-team" type="text" placeholder="Away" maxlength="20">
        </div>
      </div>

      <!-- Football-specific fields -->
      <div id="fields-football">
        <div class="form-row">
          <div class="form-group">
            <label>Half Length (M:SS)</label>
            <input id="game-clock" type="text" value="20:00" placeholder="20:00">
          </div>
          <div class="form-group">
            <label>Play Clock (sec)</label>
            <input id="play-clock" type="number" value="30" min="5" max="99">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Timeouts per Team</label>
            <input id="timeouts" type="number" value="3" min="0" max="9">
          </div>
        </div>
      </div>

      <!-- Baseball-specific fields -->
      <div id="fields-baseball" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Innings</label>
            <input id="num-innings" type="number" value="6" min="1" max="20">
          </div>
          <div class="form-group">
            <label>BSO Display</label>
            <select id="bso-style">
              <option value="dots">Dots</option>
              <option value="numbers">Numbers</option>
              <option value="both">Both</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="createGame()">Create Game</button>
      </div>
    </div>
  </div>

  <script>
    // ── Theme ────────────────────────────────────────────
    function applyTheme(t) {
      if (t === 'default') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('mbTheme', t);
      const sel = document.getElementById('theme-select');
      if (sel) sel.value = t;
    }
    (function() { applyTheme(localStorage.getItem('mbTheme') || 'default'); })();

    let allGames = [];

    async function loadGames() {
      try {
        const [fbResp, bbResp] = await Promise.all([
          fetch('/api/football/games'),
          fetch('/api/baseball/games'),
        ]);
        const fb = fbResp.ok ? await fbResp.json() : [];
        const bb = bbResp.ok ? await bbResp.json() : [];
        allGames = [
          ...fb.map(g => ({ ...g, _sport: 'football' })),
          ...bb.map(g => ({ ...g, _sport: 'baseball' })),
        ];
        renderGames();
      } catch (e) {
        console.error('Failed to load games', e);
      }
    }

    function renderGames() {
      const el = document.getElementById('games-list');
      if (!allGames.length) {
        el.innerHTML = '<div class="empty-state">No games yet. Create one to get started.</div>';
        return;
      }
      el.innerHTML = allGames.map(g => {
        if (g._sport === 'football') return renderFootballCard(g);
        if (g._sport === 'baseball') return renderBaseballCard(g);
        return '';
      }).join('');
    }

    function fmtMmSs(secs) {
      const s = Math.max(0, secs);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function clockStr(g) {
      if (g.half === 'final' || g.half === 'halftime') return g.half === 'final' ? 'Final' : 'Halftime';
      const t = fmtMmSs(g.game_clock);
      return `${t}${g.game_clock_running ? ' ▶' : ''}`;
    }

    function renderFootballCard(g) {
      const isFinal = g.half === 'final';
      const dotClass = isFinal ? 'dot-final' : 'dot-active';
      const halfLabel = {
        first:'1st Half', halftime:'Halftime', second:'2nd Half',
        ot:'Overtime', final:'Final'
      }[g.half] || g.half;
      const downLabel = ['','1st','2nd','3rd','4th'][g.down] || g.down;
      const distLabel = { midfield:'Midfield', goal:'Goal' }[g.distance] || g.distance;
      const hs = g.half_scores || { away:[null,null,null], home:[null,null,null] };
      const showOT = g.ot_enabled || hs.away[2] !== null || hs.home[2] !== null;
      const activeIdx = { first:0, second:1, ot:2 }[g.half];
      const cols = [0, 1, ...(showOT ? [2] : [])];
      const colHeaders = ['1H','2H','OT'];

      function fbCell(team, idx) {
        const v = hs[team][idx];
        const cls = v === null ? (idx === activeIdx ? 'active-h' : 'empty-h') : '';
        return `<td class="${cls}">${v === null ? (idx === activeIdx ? '—' : '') : v}</td>`;
      }

      return `
        <div class="card">
          <div class="card-sport">
            <span class="status-dot ${dotClass}"></span>
            Flag Football &nbsp;·&nbsp; ${halfLabel}
          </div>
          <table class="box-table">
            <thead><tr>
              <th class="team-h"></th>
              ${cols.map(i => `<th>${colHeaders[i]}</th>`).join('')}
              <th style="border-left:1px solid var(--border-mid)">T</th>
            </tr></thead>
            <tbody>
              <tr>
                <td class="team-h${g.possession==='away'?' poss':''}">${esc(g.away_team)}</td>
                ${cols.map(i => fbCell('away', i)).join('')}
                <td class="total-h">${g.away_score}</td>
              </tr>
              <tr>
                <td class="team-h${g.possession==='home'?' poss':''}">${esc(g.home_team)}</td>
                ${cols.map(i => fbCell('home', i)).join('')}
                <td class="total-h">${g.home_score}</td>
              </tr>
            </tbody>
          </table>
          <div class="card-state">${downLabel} &amp; ${distLabel} &nbsp;·&nbsp; ${clockStr(g)}</div>
          <div class="card-actions">
            <a href="/football.html?game=${g.id}&view=display" class="btn">Display</a>
            <a href="/football.html?game=${g.id}&view=boxscore" class="btn">Box Score</a>
            <a href="/football.html?game=${g.id}&view=control" class="btn">Control</a>
            <a href="/football.html?game=${g.id}&view=gameclock" class="btn">Game Clock</a>
            <a href="/football.html?game=${g.id}&view=playclock" class="btn">Play Clock</a>
            <a href="/football.html?game=${g.id}&view=ref" class="btn">Ref</a>
            <button class="btn btn-danger" onclick="deleteGame('football','${g.id}')">Delete</button>
          </div>
        </div>`;
    }

    function renderBaseballCard(g) {
      const isFinal = g.status === 'final';
      const dotClass = isFinal ? 'dot-final' : 'dot-active';
      const arrow = g.half === 'top' ? '▲' : '▼';
      const ordinal = ['','1st','2nd','3rd','4th','5th','6th','7th','8th','9th'];
      const innLabel = ordinal[g.current_inning] || `${g.current_inning}th`;
      const stateLabel = isFinal ? 'Final' : `${arrow} ${innLabel} · B:${g.balls} S:${g.strikes} O:${g.outs}`;
      const scores = g.scores || { away: [], home: [] };
      const numCols = scores.away.length;
      const activeIdx = g.current_inning - 1;

      function bbCell(team, idx) {
        const v = scores[team][idx];
        const isCurrent = idx === activeIdx && !isFinal;
        if (v === null) {
          return `<td class="${isCurrent ? 'active-h' : 'empty-h'}">${isCurrent ? '—' : ''}</td>`;
        }
        return `<td>${v}</td>`;
      }

      return `
        <div class="card">
          <div class="card-sport">
            <span class="status-dot ${dotClass}"></span>
            Baseball / Wiffleball &nbsp;·&nbsp; ${stateLabel}
          </div>
          <table class="box-table">
            <thead><tr>
              <th class="team-h"></th>
              ${Array.from({length: numCols}, (_, i) => `<th>${i+1}</th>`).join('')}
              <th style="border-left:1px solid var(--border-mid)">R</th>
            </tr></thead>
            <tbody>
              <tr>
                <td class="team-h">${esc(g.away_team)}</td>
                ${Array.from({length: numCols}, (_, i) => bbCell('away', i)).join('')}
                <td class="total-h">${g.away_total}</td>
              </tr>
              <tr>
                <td class="team-h">${esc(g.home_team)}</td>
                ${Array.from({length: numCols}, (_, i) => bbCell('home', i)).join('')}
                <td class="total-h">${g.home_total}</td>
              </tr>
            </tbody>
          </table>
          <div class="card-actions">
            <a href="/baseball.html?game=${g.id}&view=boxscore" class="btn">Box Score</a>
            <a href="/baseball.html?game=${g.id}&view=ump" class="btn">Ump</a>
            <a href="/baseball.html?game=${g.id}&view=control" class="btn">Control</a>
            <button class="btn btn-danger" onclick="deleteGame('baseball','${g.id}')">Delete</button>
          </div>
        </div>`;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function updateSportFields() {
      const sport = document.getElementById('sport-select').value;
      document.getElementById('fields-football').style.display = sport === 'football' ? '' : 'none';
      document.getElementById('fields-baseball').style.display = sport === 'baseball' ? '' : 'none';
    }

    function openModal() {
      document.getElementById('modal').classList.add('open');
      updateSportFields();
      setTimeout(() => document.getElementById('home-team').focus(), 50);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    async function createGame() {
      const sport    = document.getElementById('sport-select').value;
      const homeTeam = document.getElementById('home-team').value.trim() || 'Home';
      const awayTeam = document.getElementById('away-team').value.trim() || 'Away';

      let url, body;
      if (sport === 'football') {
        const gcRaw    = document.getElementById('game-clock').value.trim();
        const gcMatch  = gcRaw.match(/^(\d+):(\d{1,2})$/);
        const gameClock = gcMatch ? parseInt(gcMatch[1]) * 60 + parseInt(gcMatch[2]) : (parseInt(gcRaw) || 1200);
        const playClock = parseInt(document.getElementById('play-clock').value) || 30;
        const timeouts  = parseInt(document.getElementById('timeouts').value) ?? 3;
        url  = '/api/football/games';
        body = { home_team: homeTeam, away_team: awayTeam, game_clock: gameClock, play_clock: playClock, home_timeouts: timeouts, away_timeouts: timeouts };
      } else {
        const numInnings = parseInt(document.getElementById('num-innings').value) || 6;
        const bsoStyle   = document.getElementById('bso-style').value;
        url  = '/api/baseball/games';
        body = { home_team: homeTeam, away_team: awayTeam, num_innings: numInnings, bso_style: bsoStyle };
      }

      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (resp.ok) {
        closeModal();
        document.getElementById('home-team').value = '';
        document.getElementById('away-team').value = '';
        await loadGames();
      }
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) createGame();
      if (e.key === 'Escape') closeModal();
    });

    async function deleteGame(sport, id) {
      if (!confirm('Delete this game? This cannot be undone.')) return;
      const url = sport === 'football' ? `/api/football/games/${id}` : `/api/baseball/games/${id}`;
      const resp = await fetch(url, { method: 'DELETE' });
      if (resp.ok) await loadGames();
    }

    loadGames();
    setInterval(loadGames, 1000);
  </script>
</body>
</html>
