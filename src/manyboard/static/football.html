<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Many Board — Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      padding: 0 20px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand { font-size: 18px; font-weight: 700; color: #e94560; text-decoration: none; }

    .header-score {
      font-size: 13px;
      color: #888;
      font-family: monospace;
      margin-left: 8px;
    }

    .conn-status {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .conn-status.connected { color: #2ecc71; }
    .conn-status.connected .conn-dot { background: #2ecc71; }
    .conn-status.lost { color: #e94560; }
    .conn-status.lost .conn-dot { background: #e94560; }

    .view-tabs { display: flex; }

    .tab-btn {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      border-bottom: 2px solid transparent;
      background: transparent;
      border-top: none;
      border-left: none;
      border-right: none;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: #e0e0e0; }
    .tab-btn.active { color: #e94560; border-bottom-color: #e94560; }

    /* ── Shared view container ───────────────────────────── */
    .view { display: none; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ════════════════════════════════════════════════════════
       DISPLAY VIEW — TV Scoreboard
    ════════════════════════════════════════════════════════ */
    #view-display, #view-boxscore {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 32px 16px;
      gap: 20px;
    }

    .d-game-status {
      font-size: 13px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .d-down-distance {
      font-size: 22px;
      font-weight: 700;
      color: #4fc3f7;
      letter-spacing: 1px;
    }

    /* Original scoreboard layout */
    .d-teams-row {
      display: flex;
      align-items: center;
      gap: 48px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
    }

    .d-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 300px;
    }

    .d-team-name {
      font-size: 32px;
      font-weight: 700;
      color: #e0e0e0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }
    .d-team-name.has-ball { color: #e94560; }

    .d-team-score {
      font-size: 100px;
      font-weight: 700;
      color: #fff;
      font-family: 'Orbitron', monospace;
      line-height: 1;
    }

    .d-timeouts { display: flex; gap: 8px; }
    .d-timeout-dot {
      width: 12px; height: 12px; border-radius: 50%; background: #e94560;
    }
    .d-timeout-dot.used { background: #333; }

    .d-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .d-possession-arrow { font-size: 28px; color: #e94560; font-weight: 700; }
    .d-possession-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1px; }

    .d-clock-wrap {
      display: flex;
      gap: 48px;
      align-items: flex-end;
    }
    .d-single-clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .d-clock-value {
      font-size: 56px;
      font-weight: 700;
      color: #fff;
      font-family: 'Orbitron', monospace;
      line-height: 1;
    }
    .d-clock-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .d-nrz-badge {
      background: #e94560;
      color: #fff;
      padding: 6px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Box score table (box score view) */
    .d-box-wrap { width: 100%; max-width: 820px; }

    .d-box-table {
      width: 100%;
      border-collapse: collapse;
      font-family: monospace;
    }
    .d-box-table th {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 12px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    .d-box-table th.team-col { text-align: left; min-width: 120px; }
    .d-box-table td {
      font-size: 28px;
      font-weight: 700;
      color: #888;
      text-align: center;
      padding: 10px 12px;
    }
    .d-box-table td.team-col {
      font-size: 24px;
      font-weight: 700;
      color: #e0e0e0;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .d-box-table td.team-col.has-ball { color: #e94560; }
    .d-box-table td.total-col {
      font-size: 52px;
      color: #fff;
      padding: 10px 20px;
      border-left: 1px solid #333;
    }
    .d-box-table td.active-col { color: #4fc3f7; }
    .d-box-table td.empty-col  { color: #333; }

    .d-possession-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
    }
    .d-poss-arrow { font-size: 20px; color: #e94560; font-weight: 700; }
    .d-to-row { display: flex; gap: 32px; align-items: center; font-size: 12px; color: #555; }
    .d-to-team { display: flex; align-items: center; gap: 8px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════════════════════════════════════
       CONTROL VIEW
    ════════════════════════════════════════════════════════ */
    #view-control {
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 20px 32px;
      gap: 0;
    }

    .ctrl-section {
      margin-bottom: 20px;
    }

    .ctrl-header {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 6px;
      border-bottom: 1px solid #333;
      margin-bottom: 10px;
    }

    .ctrl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .ctrl-team-label {
      font-size: 13px;
      font-weight: 700;
      color: #4fc3f7;
      min-width: 90px;
    }

    .ctrl-score-display {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      font-family: monospace;
      min-width: 36px;
    }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: #e94560; color: #e94560; }
    .btn:active { opacity: 0.7; }

    .btn-primary {
      background: #e94560;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #c0392b; }

    .btn-score {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #333;
      background: transparent;
      color: #e0e0e0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-score:hover { border-color: #2ecc71; color: #2ecc71; }
    .btn-score.negative:hover { border-color: #e94560; color: #e94560; }

    .btn-state {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-state:hover { border-color: #555; color: #e0e0e0; }
    .btn-state.active { background: #e94560; color: #fff; border-color: #e94560; }

    .btn-nrz {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      letter-spacing: 1px;
      transition: all 0.15s;
    }
    .btn-nrz.active { background: #e94560; color: #fff; border-color: #e94560; }

    .ctrl-clock-display {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      font-family: 'Orbitron', monospace;
      line-height: 1;
      margin-bottom: 10px;
    }

    .ctrl-timeout-dots { display: flex; gap: 6px; align-items: center; }

    .ctrl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e94560;
    }
    .ctrl-dot.used { background: #333; }

    /* ════════════════════════════════════════════════════════
       FULLSCREEN CLOCK VIEWS (game clock + play clock)
    ════════════════════════════════════════════════════════ */
    #view-gameclock, #view-playclock {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      gap: 24px;
    }

    .clock-big {
      font-size: 180px;
      font-weight: 700;
      color: #fff;
      font-family: 'Orbitron', monospace;
      line-height: 1;
    }
    .clock-big.expired { color: #e94560; }

    .clock-teams {
      font-size: 18px;
      color: #888;
      font-family: monospace;
      letter-spacing: 2px;
    }

    .clock-label {
      font-size: 16px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">MANY BOARD</a>
    <span class="header-score" id="header-score"></span>
    <nav class="view-tabs">
      <button class="tab-btn" id="tab-display"   onclick="switchView('display')">Display</button>
      <button class="tab-btn" id="tab-boxscore"  onclick="switchView('boxscore')">Box Score</button>
      <button class="tab-btn" id="tab-control"   onclick="switchView('control')">Control</button>
      <button class="tab-btn" id="tab-gameclock" onclick="switchView('gameclock')">Game Clock</button>
      <button class="tab-btn" id="tab-playclock" onclick="switchView('playclock')">Play Clock</button>
    </nav>
    <span id="conn-status" class="conn-status connected"><span class="conn-dot"></span>Connected</span>
  </header>

  <!-- ── DISPLAY VIEW — TV Scoreboard ─────────────────── -->
  <div class="view" id="view-display">
    <div class="d-game-status" id="d-half"></div>
    <div class="d-down-distance" id="d-down-dist"></div>

    <div class="d-teams-row">
      <div class="d-team">
        <div class="d-team-name" id="d-away-name"></div>
        <div class="d-team-score" id="d-away-score"></div>
        <div class="d-timeouts" id="d-away-timeouts"></div>
      </div>

      <div class="d-divider">
        <div class="d-possession-arrow" id="d-poss-arrow"></div>
        <div class="d-possession-label">possession</div>
      </div>

      <div class="d-team">
        <div class="d-team-name" id="d-home-name"></div>
        <div class="d-team-score" id="d-home-score"></div>
        <div class="d-timeouts" id="d-home-timeouts"></div>
      </div>
    </div>

    <div class="d-clock-wrap">
      <div class="d-single-clock">
        <div class="d-clock-value" id="d-game-clock"></div>
        <div class="d-clock-label">game clock</div>
      </div>
      <div class="d-single-clock">
        <div class="d-clock-value" id="d-play-clock" style="font-size:40px"></div>
        <div class="d-clock-label">play clock</div>
      </div>
    </div>

    <div class="d-nrz-badge" id="d-nrz" style="display:none">NO RUN ZONE</div>
  </div>

  <!-- ── BOX SCORE VIEW ────────────────────────────────── -->
  <div class="view" id="view-boxscore">
    <div class="d-game-status" id="bs-half"></div>
    <div class="d-down-distance" id="bs-down-dist"></div>

    <div class="d-box-wrap">
      <table class="d-box-table">
        <thead>
          <tr>
            <th class="team-col"></th>
            <th>1H</th>
            <th>2H</th>
            <th id="bs-ot-header" style="display:none">OT</th>
            <th style="border-left:1px solid #333">Total</th>
          </tr>
        </thead>
        <tbody id="bs-box-body"></tbody>
      </table>
    </div>

    <div class="d-possession-row">
      <span class="d-poss-arrow" id="bs-poss-arrow"></span>
      <span id="bs-poss-label"></span>
      &nbsp;·&nbsp;
      <div class="d-to-row">
        <div class="d-to-team">
          <span id="bs-away-to-name" style="color:#888"></span>
          <div class="d-timeouts" id="bs-away-timeouts"></div>
        </div>
        <div class="d-to-team">
          <span id="bs-home-to-name" style="color:#888"></span>
          <div class="d-timeouts" id="bs-home-timeouts"></div>
        </div>
      </div>
    </div>

    <div class="d-clock-wrap">
      <div class="d-single-clock">
        <div class="d-clock-value" id="bs-game-clock"></div>
        <div class="d-clock-label">game clock</div>
      </div>
      <div class="d-single-clock">
        <div class="d-clock-value" id="bs-play-clock" style="font-size:40px"></div>
        <div class="d-clock-label">play clock</div>
      </div>
    </div>

    <div class="d-nrz-badge" id="bs-nrz" style="display:none">NO RUN ZONE</div>
  </div>

  <!-- ── CONTROL VIEW ──────────────────────────────────── -->
  <div class="view" id="view-control">

    <!-- Scoring -->
    <div class="ctrl-section">
      <div class="ctrl-header">Scoring</div>

      <div class="ctrl-row">
        <span class="ctrl-team-label" id="c-home-label"></span>
        <span class="ctrl-score-display" id="c-home-score"></span>
        <button class="btn-score" onclick="addScore('home',6)">TD +6</button>
        <button class="btn-score" onclick="addScore('home',1)">PAT +1</button>
        <button class="btn-score" onclick="addScore('home',2)">2PT +2</button>
        <button class="btn-score" onclick="addScore('home',3)">FG +3</button>
        <button class="btn-score" onclick="addScore('home',2)">SAF +2</button>
        <button class="btn-score negative" onclick="addScore('home',-1)">-1</button>
      </div>

      <div class="ctrl-row">
        <span class="ctrl-team-label" id="c-away-label"></span>
        <span class="ctrl-score-display" id="c-away-score"></span>
        <button class="btn-score" onclick="addScore('away',6)">TD +6</button>
        <button class="btn-score" onclick="addScore('away',1)">PAT +1</button>
        <button class="btn-score" onclick="addScore('away',2)">2PT +2</button>
        <button class="btn-score" onclick="addScore('away',3)">FG +3</button>
        <button class="btn-score" onclick="addScore('away',2)">SAF +2</button>
        <button class="btn-score negative" onclick="addScore('away',-1)">-1</button>
      </div>
    </div>

    <!-- PAT Attempt -->
    <div class="ctrl-section">
      <div class="ctrl-header">After TD — Point Attempt</div>
      <div class="ctrl-row">
        <button class="btn-state" id="pat-1pt-btn" onclick="setPAT('1pt')">1-Pt Attempt</button>
        <button class="btn-state" id="pat-2pt-btn" onclick="setPAT('2pt')">2-Pt Attempt</button>
        <button class="btn" id="pat-clear-btn" onclick="setPAT(null)">Clear</button>
      </div>
    </div>

    <!-- Down & Distance -->
    <div class="ctrl-section">
      <div class="ctrl-header">Down &amp; Distance</div>
      <div class="ctrl-row">
        <button class="btn-state" id="down-1" onclick="setDown(1)">1st</button>
        <button class="btn-state" id="down-2" onclick="setDown(2)">2nd</button>
        <button class="btn-state" id="down-3" onclick="setDown(3)">3rd</button>
        <button class="btn-state" id="down-4" onclick="setDown(4)">4th</button>
        &nbsp;
        <button class="btn-state" id="dist-midfield" onclick="setDistance('midfield')">Midfield</button>
        <button class="btn-state" id="dist-goal"     onclick="setDistance('goal')">Goal</button>
      </div>
    </div>

    <!-- Possession -->
    <div class="ctrl-section">
      <div class="ctrl-header">Possession</div>
      <div class="ctrl-row">
        <button class="btn-state" id="poss-home" onclick="setPossession('home')"></button>
        <button class="btn-state" id="poss-away" onclick="setPossession('away')"></button>
      </div>
    </div>

    <!-- Timeouts -->
    <div class="ctrl-section">
      <div class="ctrl-header">Timeouts</div>
      <div class="ctrl-row">
        <span class="ctrl-team-label" id="c-home-to-label"></span>
        <div class="ctrl-timeout-dots" id="c-home-to-dots"></div>
        <button class="btn" onclick="useTimeout('home')">Use TO</button>
        <button class="btn" onclick="restoreTimeout('home')" style="font-size:11px">Restore</button>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-team-label" id="c-away-to-label"></span>
        <div class="ctrl-timeout-dots" id="c-away-to-dots"></div>
        <button class="btn" onclick="useTimeout('away')">Use TO</button>
        <button class="btn" onclick="restoreTimeout('away')" style="font-size:11px">Restore</button>
      </div>
    </div>

    <!-- Half -->
    <div class="ctrl-section">
      <div class="ctrl-header">Half</div>
      <div class="ctrl-row">
        <button class="btn-state" id="half-first"    onclick="setHalf('first')">1st Half</button>
        <button class="btn-state" id="half-halftime" onclick="setHalf('halftime')">Halftime</button>
        <button class="btn-state" id="half-second"   onclick="setHalf('second')">2nd Half</button>
        <button class="btn-state" id="half-ot" style="display:none" onclick="setHalf('ot')">OT</button>
        <button class="btn-state" id="half-final"    onclick="setHalf('final')">Final</button>
      </div>
    </div>

    <!-- Half Score Correction -->
    <div class="ctrl-section">
      <div class="ctrl-header">Half Score Correction</div>
      <div class="ctrl-row">
        <span style="font-size:12px;color:#888">Half</span>
        <select id="corr-half" style="background:#111;color:#e0e0e0;border:1px solid #333;padding:5px 8px;border-radius:6px;font-size:13px;outline:none;">
          <option value="first">1st Half</option>
          <option value="second">2nd Half</option>
          <option value="ot">OT</option>
        </select>
        <span style="font-size:12px;color:#888">Team</span>
        <select id="corr-team" style="background:#111;color:#e0e0e0;border:1px solid #333;padding:5px 8px;border-radius:6px;font-size:13px;outline:none;">
          <option value="home">Home</option>
          <option value="away">Away</option>
        </select>
        <span style="font-size:12px;color:#888">Pts</span>
        <input id="corr-pts" type="number" value="0" style="width:60px;background:#111;color:#e0e0e0;border:1px solid #333;padding:5px 8px;border-radius:6px;font-size:13px;outline:none;">
        <button class="btn-primary" onclick="setHalfScore()">Set</button>
      </div>
    </div>

    <!-- Game Clock -->
    <div class="ctrl-section">
      <div class="ctrl-header">Game Clock</div>
      <div class="ctrl-clock-display" id="c-game-clock-display"></div>
      <div class="ctrl-row">
        <button class="btn-primary" id="game-clock-toggle-btn" onclick="toggleGameClock()">Start</button>
        <button class="btn" onclick="resetGameClock()">Reset</button>
      </div>
    </div>

    <!-- Play Clock -->
    <div class="ctrl-section">
      <div class="ctrl-header">Play Clock</div>
      <div class="ctrl-clock-display" id="c-play-clock-display"></div>
      <div class="ctrl-row">
        <button class="btn-primary" id="play-clock-toggle-btn" onclick="togglePlayClock()">Start</button>
        <button class="btn" onclick="resetPlayClock()">Reset</button>
      </div>
    </div>

    <!-- No Run Zone / OT -->
    <div class="ctrl-section">
      <div class="ctrl-header">Situational</div>
      <div class="ctrl-row">
        <button class="btn-nrz" id="nrz-btn" onclick="toggleNRZ()">No Run Zone</button>
        <button class="btn-nrz" id="ot-enable-btn" onclick="toggleOT()">Enable OT</button>
      </div>
    </div>

  </div>

  <!-- ── GAME CLOCK VIEW ──────────────────────────────── -->
  <div class="view" id="view-gameclock">
    <div class="clock-teams" id="gck-teams"></div>
    <div class="clock-big" id="gck-clock"></div>
    <div class="clock-label" id="gck-half"></div>
  </div>

  <!-- ── PLAY CLOCK VIEW ──────────────────────────────── -->
  <div class="view" id="view-playclock">
    <div class="clock-teams" id="pck-teams"></div>
    <div class="clock-big" id="pck-clock"></div>
    <div class="clock-label">PLAY CLOCK</div>
  </div>

  <script>
    // ── State ────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');
    let view = params.get('view') || 'display';
    let state = null;
    let failCount = 0;

    if (!gameId) { window.location.href = '/'; }

    // ── Helpers ──────────────────────────────────────────
    function fmtMmSs(secs) {
      const s = Math.max(0, secs);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    // ── View switching ───────────────────────────────────
    function switchView(v) {
      view = v;
      const url = new URL(window.location);
      url.searchParams.set('view', v);
      history.replaceState(null, '', url);
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + v).classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + v).classList.add('active');
      if (state) render();
    }

    // ── Polling — server is source of truth ─────────────
    function setConnStatus(ok) {
      const el = document.getElementById('conn-status');
      if (!el) return;
      if (ok) {
        el.className = 'conn-status connected';
        el.innerHTML = '<span class="conn-dot"></span>Connected';
      } else {
        el.className = 'conn-status lost';
        el.innerHTML = '<span class="conn-dot"></span>Signal Lost';
      }
    }

    async function poll() {
      try {
        const resp = await fetch('/api/football/games/' + gameId);
        if (!resp.ok) { failCount++; if (failCount >= 3) setConnStatus(false); return; }
        state = await resp.json();
        failCount = 0;
        setConnStatus(true);
        render();
      } catch (e) { failCount++; if (failCount >= 3) setConnStatus(false); }
    }

    // ── Render ───────────────────────────────────────────
    const HALF_LABEL = {
      first:'1st Half', halftime:'Halftime', second:'2nd Half',
      ot:'Overtime', final:'Final'
    };
    const DOWN_LABEL = { 1:'1st', 2:'2nd', 3:'3rd', 4:'4th' };
    const DIST_LABEL = { midfield:'Midfield', goal:'Goal' };

    function render() {
      if (!state) return;
      renderHeader();
      if (view === 'display')       renderDisplay();
      else if (view === 'boxscore') renderBoxscore();
      else if (view === 'control')  renderControl();
      else if (view === 'gameclock') renderGameClockView();
      else if (view === 'playclock') renderPlayClockView();
    }

    function renderHeader() {
      document.getElementById('header-score').textContent =
        `${state.away_team} ${state.away_score} – ${state.home_score} ${state.home_team}`;
    }

    function renderClockElements() {
      const gcVal = state?.game_clock ?? 0;
      const pcVal = state?.play_clock ?? 0;
      const gcRun = state?.game_clock_running ?? false;
      const pcRun = state?.play_clock_running ?? false;

      // IDs that need updating across all views
      [
        ['d-game-clock',  fmtMmSs(gcVal), gcRun, false],
        ['d-play-clock',  pcVal,           pcRun, false],
        ['bs-game-clock', fmtMmSs(gcVal), gcRun, false],
        ['bs-play-clock', pcVal,           pcRun, false],
        ['c-game-clock-display', fmtMmSs(gcVal), gcRun, false],
        ['c-play-clock-display', pcVal,           pcRun, false],
      ].forEach(([id, val, running]) => {
        const el = document.getElementById(id);
        if (el) { el.textContent = val; el.classList.toggle('running', running); }
      });

      const gckEl = document.getElementById('gck-clock');
      if (gckEl) {
        gckEl.textContent = fmtMmSs(gcVal);
        gckEl.classList.toggle('running', gcRun);
        gckEl.classList.toggle('expired', gcVal === 0);
      }
      const pckEl = document.getElementById('pck-clock');
      if (pckEl) {
        pckEl.textContent = pcVal;
        pckEl.classList.toggle('running', pcRun);
        pckEl.classList.toggle('expired', pcVal === 0);
      }
    }

    function downDistText() {
      if (state.pat) return `PAT — ${state.pat} Attempt`;
      return `${DOWN_LABEL[state.down]} & ${DIST_LABEL[state.distance]}`;
    }

    function renderDisplay() {
      setText('d-half', HALF_LABEL[state.half] || state.half);
      setText('d-down-dist', downDistText());

      setText('d-away-name', state.away_team.toUpperCase());
      setText('d-home-name', state.home_team.toUpperCase());
      setText('d-away-score', state.away_score);
      setText('d-home-score', state.home_score);

      document.getElementById('d-away-name')?.classList.toggle('has-ball', state.possession === 'away');
      document.getElementById('d-home-name')?.classList.toggle('has-ball', state.possession === 'home');
      setText('d-poss-arrow', state.possession === 'away' ? '←' : '→');

      renderDots('d-away-timeouts', state.away_timeouts, 'd-timeout-dot', 3);
      renderDots('d-home-timeouts', state.home_timeouts, 'd-timeout-dot', 3);
      renderClockElements();
      document.getElementById('d-nrz').style.display = state.no_run_zone ? 'block' : 'none';
    }

    function renderBoxscore() {
      setText('bs-half', HALF_LABEL[state.half] || state.half);
      setText('bs-down-dist', downDistText());

      const hs = state.half_scores;
      const showOT = state.ot_enabled || hs.away[2] !== null || hs.home[2] !== null;
      document.getElementById('bs-ot-header').style.display = showOT ? '' : 'none';

      const activeIdx = { first:0, second:1, ot:2 }[state.half];
      const tbody = document.getElementById('bs-box-body');
      const rows = [
        { label: state.away_team, key: 'away', total: state.away_score, poss: state.possession === 'away' },
        { label: state.home_team, key: 'home', total: state.home_score, poss: state.possession === 'home' },
      ];
      tbody.innerHTML = rows.map(r => {
        const cells = [0, 1, ...(showOT ? [2] : [])].map(i => {
          const v = hs[r.key][i];
          const cls = v === null ? (i === activeIdx ? 'active-col' : 'empty-col') : '';
          return `<td class="${cls}">${v === null ? (i === activeIdx ? '—' : '') : v}</td>`;
        }).join('');
        return `<tr>
          <td class="team-col${r.poss ? ' has-ball' : ''}">${r.poss ? '▶ ' : ''}${r.label.toUpperCase()}</td>
          ${cells}
          <td class="total-col">${r.total}</td>
        </tr>`;
      }).join('');

      setText('bs-poss-arrow', state.possession === 'away' ? '◀' : '▶');
      setText('bs-poss-label',
        `${state.possession === 'away' ? state.away_team : state.home_team} ball`);
      setText('bs-away-to-name', state.away_team);
      setText('bs-home-to-name', state.home_team);
      renderDots('bs-away-timeouts', state.away_timeouts, 'd-timeout-dot', 3);
      renderDots('bs-home-timeouts', state.home_timeouts, 'd-timeout-dot', 3);
      renderClockElements();
      document.getElementById('bs-nrz').style.display = state.no_run_zone ? 'block' : 'none';
    }

    function renderControl() {
      setText('c-home-label', state.home_team);
      setText('c-away-label', state.away_team);
      setText('c-home-score', state.home_score);
      setText('c-away-score', state.away_score);

      [1,2,3,4].forEach(d =>
        document.getElementById('down-' + d)?.classList.toggle('active', state.down === d)
      );
      ['midfield','goal'].forEach(d =>
        document.getElementById('dist-' + d)?.classList.toggle('active', state.distance === d)
      );

      const ph = document.getElementById('poss-home');
      const pa = document.getElementById('poss-away');
      if (ph) { ph.textContent = '← ' + state.home_team; ph.classList.toggle('active', state.possession === 'home'); }
      if (pa) { pa.textContent = state.away_team + ' →'; pa.classList.toggle('active', state.possession === 'away'); }

      setText('c-home-to-label', state.home_team);
      setText('c-away-to-label', state.away_team);
      renderDots('c-home-to-dots', state.home_timeouts, 'ctrl-dot', 3);
      renderDots('c-away-to-dots', state.away_timeouts, 'ctrl-dot', 3);

      ['first','halftime','second','final'].forEach(h =>
        document.getElementById('half-' + h)?.classList.toggle('active', state.half === h)
      );
      const otBtn = document.getElementById('half-ot');
      if (otBtn) {
        otBtn.style.display = state.ot_enabled ? '' : 'none';
        otBtn.classList.toggle('active', state.half === 'ot');
      }
      document.getElementById('ot-enable-btn')?.classList.toggle('active', state.ot_enabled);

      renderClockElements();
      const gcBtn = document.getElementById('game-clock-toggle-btn');
      if (gcBtn) gcBtn.textContent = state.game_clock_running ? 'Stop' : 'Start';
      const pcBtn = document.getElementById('play-clock-toggle-btn');
      if (pcBtn) pcBtn.textContent = state.play_clock_running ? 'Stop' : 'Start';

      document.getElementById('nrz-btn')?.classList.toggle('active', state.no_run_zone);
      document.getElementById('pat-1pt-btn')?.classList.toggle('active', state.pat === '1pt');
      document.getElementById('pat-2pt-btn')?.classList.toggle('active', state.pat === '2pt');
    }

    function renderGameClockView() {
      const halfMap = {
        first:'1st Half', halftime:'Halftime', second:'2nd Half',
        ot:'Overtime', final:'Final'
      };
      renderClockElements();
      setText('gck-teams', `${state.home_team} ${state.home_score} – ${state.away_score} ${state.away_team}`);
      setText('gck-half', halfMap[state.half] || state.half);
    }

    function renderPlayClockView() {
      renderClockElements();
      setText('pck-teams', `${state.home_team} ${state.home_score} – ${state.away_score} ${state.away_team}`);
    }

    // ── API helpers ──────────────────────────────────────
    async function patch(endpoint, body = null) {
      const opts = { method: 'PATCH' };
      if (body !== null) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      const resp = await fetch(`/api/football/games/${gameId}/${endpoint}`, opts);
      if (resp.ok) {
        state = await resp.json();
        render();
      }
    }

    // ── Actions ──────────────────────────────────────────
    async function addScore(team, delta)     { await patch('score', { team, delta }); }
    async function setDown(d)                { await patch('down', { down: d, distance: state?.distance || 'midfield' }); }
    async function setDistance(d)            { await patch('down', { down: state?.down || 1, distance: d }); }
    async function setPossession(p)          { await patch('possession', { possession: p }); }
    async function useTimeout(team)          { await patch('timeout', { team }); }
    async function restoreTimeout(team)      { await patch('timeout/restore', { team }); }
    async function setHalf(h)                { await patch('half', { half: h }); }
    async function toggleNRZ()  { if (state) await patch('no-run-zone', { enabled: !state.no_run_zone }); }
    async function setPAT(val)  { await patch('pat', { pat: val }); }
    async function toggleOT()   { if (state) await patch('ot', { enabled: !state.ot_enabled }); }

    async function setHalfScore() {
      const half   = document.getElementById('corr-half').value;
      const team   = document.getElementById('corr-team').value;
      const points = parseInt(document.getElementById('corr-pts').value);
      if (isNaN(points)) return;
      await patch('half-score', { half, team, points });
    }

    async function toggleGameClock() {
      if (!state) return;
      await patch(state.game_clock_running ? 'game-clock/stop' : 'game-clock/start');
    }
    async function resetGameClock() { await patch('game-clock/reset'); }

    async function togglePlayClock() {
      if (!state) return;
      await patch(state.play_clock_running ? 'play-clock/stop' : 'play-clock/start');
    }
    async function resetPlayClock() { await patch('play-clock/reset'); }

    // ── DOM helpers ──────────────────────────────────────
    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    }

    function renderDots(containerId, count, cssClass, maxDots) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const max = maxDots ?? count;
      let html = '';
      for (let i = 0; i < max; i++) {
        html += `<span class="${cssClass}${i >= count ? ' used' : ''}"></span>`;
      }
      el.innerHTML = html;
    }

    // ── Init ─────────────────────────────────────────────
    switchView(view);
    poll();
    setInterval(poll, 200);
  </script>
</body>
</html>
