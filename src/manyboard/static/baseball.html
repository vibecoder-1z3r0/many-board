<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Many Board — Baseball</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #1a1a2e;
      --panel:       #16213e;
      --border:      #0f3460;
      --border-mid:  #2a2a3e;
      --border-dark: #333;
      --input-bg:    #111;
      --accent:      #e94560;
      --accent-dark: #c0392b;
      --text:        #e0e0e0;
      --text-dim:    #888;
      --text-dimmer: #555;
      --text-bright: #fff;
      --highlight:   #4fc3f7;
    }
    [data-theme="stadium"] {
      --bg:          #000000;
      --panel:       #0d0d0d;
      --border:      #2a2a2a;
      --border-mid:  #1f1f1f;
      --border-dark: #1a1a1a;
      --input-bg:    #111111;
      --accent:      #00e5ff;
      --accent-dark: #00b8cc;
      --text:        #ffffff;
      --text-dim:    #aaaaaa;
      --text-dimmer: #666666;
      --text-bright: #ffffff;
      --highlight:   #ffeb3b;
    }
    [data-theme="field"] {
      --bg:          #0a1a0a;
      --panel:       #0f200f;
      --border:      #1e4d1e;
      --border-mid:  #162816;
      --border-dark: #1e3a1e;
      --input-bg:    #071207;
      --accent:      #f5a623;
      --accent-dark: #d4891a;
      --text:        #e8f0e8;
      --text-dim:    #7a9e7a;
      --text-dimmer: #4a6a4a;
      --text-bright: #ffffff;
      --highlight:   #7dff8a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand { font-size: 18px; font-weight: 700; color: var(--accent); text-decoration: none; }
    .header-score { font-size: 13px; color: var(--text-dim); font-family: monospace; }
    .conn-status {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .conn-status.connected { color: #2ecc71; }
    .conn-status.connected .conn-dot { background: #2ecc71; }
    .conn-status.lost { color: var(--accent); }
    .conn-status.lost .conn-dot { background: var(--accent); }

    .theme-select {
      background: var(--input-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-dark);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .theme-select:focus { border-color: var(--accent); color: var(--text); }

    .view-tabs { display: flex; }
    .tab-btn {
      padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--text-dim);
      border-bottom: 2px solid transparent; background: transparent;
      border-top: none; border-left: none; border-right: none;
      cursor: pointer; text-decoration: none; display: flex; align-items: center;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Views ───────────────────────────────────────────── */
    .view { display: none; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ════════════════════════════════════════════════════
       BOXSCORE VIEW
    ════════════════════════════════════════════════════ */
    #view-boxscore {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vh, 28px);
      padding: clamp(8px, 2vh, 24px) clamp(8px, 2vw, 24px);
      background: var(--bg);
    }

    /* Box score table */
    .bs-table-wrap { overflow-x: auto; max-width: 100%; }
    .bs-table {
      border-collapse: collapse;
      font-family: monospace;
      font-size: clamp(20px, 3.5vh, 28px);
    }
    .bs-table th, .bs-table td {
      padding: clamp(6px, 1.2vh, 12px) clamp(8px, 2vw, 16px);
      text-align: center;
      border-bottom: 1px solid var(--border-dark);
    }
    .bs-table th {
      font-size: clamp(11px, 1.5vw, 14px);
      color: var(--text-dimmer);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    .bs-team-name {
      font-size: clamp(20px, 3.5vh, 28px);
      font-weight: 700;
      color: var(--text);
      text-align: left !important;
      min-width: clamp(70px, 12vw, 120px);
      white-space: nowrap;
    }
    .bs-inning-score { color: var(--text); min-width: clamp(20px, 3vw, 36px); }
    .bs-inning-score.current { color: var(--highlight); font-weight: 700; }
    .bs-inning-score.empty { color: var(--border-dark); }
    .bs-total {
      font-size: clamp(34px, 7vh, 48px);
      font-weight: 700;
      color: var(--text-bright);
      font-family: 'Orbitron', monospace;
      border-left: 1px solid var(--border) !important;
    }
    .bs-divider { border-left: 1px solid var(--border); }

    /* Status row */
    .bs-status {
      font-size: clamp(24px, 5vh, 32px);
      font-weight: 700;
      color: var(--highlight);
      letter-spacing: 1px;
    }
    .bs-status-sub { font-size: clamp(12px, 1.8vw, 16px); color: var(--text-dim); margin-top: 4px; }

    /* ── BSO display ─────────────────────────────────────── */
    .bso-wrap {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    .bso-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bso-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dimmer);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .bso-dots { display: flex; gap: 6px; }
    .bso-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #222; border: 2px solid var(--border-dark);
      transition: background 0.15s, border-color 0.15s;
    }
    .bso-dot.ball-on   { background: #3498db; border-color: #3498db; }
    .bso-dot.strike-on { background: #f39c12; border-color: #f39c12; }
    .bso-dot.out-on    { background: var(--accent); border-color: var(--accent); }
    .bso-number {
      font-size: clamp(30px, 6vh, 44px);
      font-weight: 700;
      font-family: monospace;
      line-height: 1;
    }
    .bso-number.ball-val   { color: #3498db; }
    .bso-number.strike-val { color: #f39c12; }
    .bso-number.out-val    { color: var(--accent); }

    /* ── Diamond ─────────────────────────────────────────── */
    .diamond-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .diamond-label {
      font-size: 11px;
      color: var(--text-dimmer);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .diamond {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
    }
    .base {
      width: 40px; height: 40px;
      background: var(--input-bg);
      border: 2px solid var(--border-dark);
      border-radius: 4px;
      transform: rotate(45deg);
      transition: background 0.15s, border-color 0.15s;
      cursor: default;
    }
    .base.occupied { background: #f39c12; border-color: #f39c12; }
    .base.home-plate {
      border-radius: 50%;
      background: #222;
      border-color: #444;
    }
    .base-empty { /* spacer */ }

    /* ════════════════════════════════════════════════════
       UMP CONTROL VIEW
    ════════════════════════════════════════════════════ */
    #view-ump {
      flex-direction: column;
      overflow-y: auto;
      padding: 12px 16px 32px;
      gap: 0;
    }

    .ctrl-section { margin-bottom: 16px; }
    .ctrl-header {
      font-size: 11px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase;
      letter-spacing: 1px; padding-bottom: 6px; border-bottom: 1px solid var(--border-dark);
      margin-bottom: 10px;
    }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }

    /* BSO live display in ump view */
    .ump-bso {
      display: flex;
      gap: 20px;
      padding: 12px 0;
      align-items: center;
    }
    .ump-bso-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .ump-bso-label { font-size: 11px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1px; }
    .ump-bso-val {
      font-size: 40px;
      font-weight: 700;
      font-family: monospace;
      line-height: 1;
    }
    .ump-bso-dots { display: flex; gap: 5px; }
    .ump-bso-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #222; border: 2px solid var(--border-dark);
    }
    .ump-bso-dot.on { }

    /* Buttons */
    .btn {
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border-dark); background: transparent; color: var(--text-dim);
      transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { opacity: 0.7; }

    .btn-big {
      padding: 14px 20px; border-radius: 8px; font-size: 16px; font-weight: 700;
      cursor: pointer; border: 2px solid; transition: all 0.15s; min-width: 90px;
      text-align: center;
    }
    .btn-big:active { opacity: 0.7; transform: scale(0.97); }

    .btn-ball   { background: #1a2a3e; color: #3498db; border-color: #3498db; }
    .btn-ball:hover   { background: #3498db; color: var(--text-bright); }
    .btn-strike { background: #2e1a0e; color: #f39c12; border-color: #f39c12; }
    .btn-strike:hover { background: #f39c12; color: var(--input-bg); }
    .btn-foul   { background: #2a1a0e; color: #e67e22; border-color: #e67e22; }
    .btn-foul:hover   { background: #e67e22; color: var(--input-bg); }
    .btn-out    { background: #2e0e0e; color: var(--accent); border-color: var(--accent); }
    .btn-out:hover    { background: var(--accent); color: var(--text-bright); }
    .btn-run    { background: #0e2e0e; color: #2ecc71; border-color: #2ecc71; }
    .btn-run:hover    { background: #2ecc71; color: var(--input-bg); }

    .btn-primary {
      background: var(--accent); color: white; border: none; padding: 8px 18px;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--accent-dark); }

    /* Diamond in ump view (tappable) */
    .ump-diamond { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
    .ump-base {
      width: 44px; height: 44px; background: var(--input-bg); border: 2px solid var(--border-dark);
      border-radius: 4px; transform: rotate(45deg); cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .ump-base.occupied { background: #f39c12; border-color: #f39c12; }
    .ump-base.home-plate { border-radius: 50%; background: #222; border-color: #444; cursor: default; }
    .ump-base:hover:not(.home-plate) { border-color: var(--text-dim); }

    /* Inning score inline edit */
    .inning-edit-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .inning-edit-input {
      background: var(--input-bg); color: var(--text); border: 1px solid var(--border-dark); padding: 6px 8px;
      border-radius: 6px; font-size: 13px; outline: none; width: 60px; text-align: center;
    }
    .inning-edit-input:focus { border-color: var(--accent); }

    /* Team name editing */
    .team-name-input {
      background: var(--input-bg); color: var(--text); border: 1px solid var(--border-dark); padding: 5px 8px;
      border-radius: 6px; font-size: 13px; outline: none; max-width: 120px;
    }
    .team-name-input:focus { border-color: var(--accent); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Stats mini-table ────────────────────────────────── */
    .bs-stats-wrap { overflow-x: auto; max-width: 100%; }
    .bs-stats-table {
      border-collapse: collapse;
      font-family: monospace;
      font-size: clamp(14px, 2.5vh, 20px);
      color: var(--text-dim);
    }
    .bs-stats-table th {
      font-size: clamp(10px, 1.4vh, 13px);
      color: var(--text-dimmer);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-bottom: 1px solid var(--border-dark);
    }
    .bs-stats-table td {
      padding: 4px 10px;
      text-align: center;
    }
    .bs-stats-table .stat-team { text-align: left; color: var(--text); font-weight: 700; white-space: nowrap; }
    .bs-stats-table .stat-hits { color: var(--highlight); }
    .bs-stats-table .stat-err  { color: var(--accent); }

    /* ── At bat / On deck banners ────────────────────────── */
    .batting-banners { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .at-bat-banner {
      font-size: clamp(16px, 2.8vh, 24px);
      font-weight: 700;
      color: var(--text-bright);
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 6px 16px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .at-bat-banner .batting-label {
      font-size: clamp(9px, 1.2vh, 11px);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      margin-right: 8px;
    }
    .on-deck-banner {
      font-size: clamp(13px, 2vh, 18px);
      color: var(--text-dim);
      background: var(--panel);
      border: 1px solid var(--border-dark);
      border-left: 4px solid var(--highlight);
      padding: 5px 16px;
      border-radius: 6px;
    }
    .on-deck-banner .batting-label {
      font-size: clamp(9px, 1.2vh, 11px);
      color: var(--highlight);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      margin-right: 8px;
    }

    /* ── Stat buttons in ump view ────────────────────────── */
    .btn-hit { background: #0e1e2e; color: var(--highlight); border-color: var(--highlight); }
    .btn-hit:hover { background: var(--highlight); color: var(--input-bg); }
    .btn-hr  { background: #0e2e0e; color: #2ecc71; border-color: #2ecc71; }
    .btn-hr:hover  { background: #2ecc71; color: var(--input-bg); }
    .btn-err { background: #2e0e0e; color: var(--accent); border-color: var(--accent); }
    .btn-err:hover { background: var(--accent); color: var(--text-bright); }

    /* Batting order inputs in control */
    .batting-input {
      background: var(--input-bg); color: var(--text); border: 1px solid var(--border-dark);
      padding: 5px 8px; border-radius: 6px; font-size: 13px; outline: none; max-width: 160px;
    }
    .batting-input:focus { border-color: var(--accent); }
    .vis-btn { font-size: 11px; padding: 4px 8px; }
    .vis-btn.hidden-state { border-color: var(--text-dimmer); color: var(--text-dimmer); }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">MANY BOARD</a>
    <span class="header-score" id="header-score"></span>
    <nav class="view-tabs">
      <button class="tab-btn" id="tab-boxscore" onclick="switchView('boxscore')">Box Score</button>
      <button class="tab-btn" id="tab-ump"      onclick="switchView('ump')">Ump</button>
      <button class="tab-btn" id="tab-control"  onclick="switchView('control')">Control</button>
    </nav>
    <select id="theme-select" class="theme-select" onchange="applyTheme(this.value)" title="Switch theme">
      <option value="default">Default</option>
      <option value="stadium">Stadium</option>
      <option value="field">Field</option>
    </select>
    <span id="conn-status" class="conn-status connected"><span class="conn-dot"></span>Connected</span>
  </header>

  <!-- ── BOX SCORE VIEW ────────────────────────────────── -->
  <div class="view" id="view-boxscore">

    <div class="bs-table-wrap">
      <table class="bs-table">
        <thead>
          <tr id="bs-header-row">
            <th></th>
            <!-- inning headers injected by JS -->
            <th class="bs-divider">R</th>
          </tr>
        </thead>
        <tbody>
          <tr id="bs-away-row">
            <td class="bs-team-name" id="bs-away-name"></td>
            <!-- scores injected -->
            <td class="bs-total" id="bs-away-total"></td>
          </tr>
          <tr id="bs-home-row">
            <td class="bs-team-name" id="bs-home-name"></td>
            <!-- scores injected -->
            <td class="bs-total" id="bs-home-total"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="text-align:center">
      <div class="bs-status" id="bs-inning-label"></div>
    </div>

    <div style="display:flex; gap:48px; align-items:flex-start; justify-content:center; flex-wrap:wrap;">
      <!-- BSO -->
      <div class="bso-wrap" id="bs-bso"></div>

      <!-- Diamond -->
      <div class="diamond-wrap">
        <div class="diamond-label">Bases</div>
        <div class="diamond">
          <div class="base-empty"></div>
          <div class="base" id="bs-base-2nd"></div>
          <div class="base-empty"></div>
          <div class="base" id="bs-base-3rd"></div>
          <div class="base-empty"></div>
          <div class="base" id="bs-base-1st"></div>
          <div class="base-empty"></div>
          <div class="base home-plate" id="bs-base-home"></div>
          <div class="base-empty"></div>
        </div>
      </div>
    </div>

    <!-- Stats mini-table -->
    <div class="bs-stats-wrap" id="bs-stats-wrap">
      <table class="bs-stats-table">
        <thead>
          <tr>
            <th></th>
            <th>H</th>
            <th>E</th>
            <th>K</th>
            <th>LOB</th>
            <th>1B</th>
            <th>2B</th>
            <th>3B</th>
            <th>HR</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="stat-team" id="bs-stat-away-name"></td>
            <td class="stat-hits" id="bs-stat-away-hits"></td>
            <td class="stat-err"  id="bs-stat-away-errors"></td>
            <td id="bs-stat-away-k"></td>
            <td id="bs-stat-away-lob"></td>
            <td id="bs-stat-away-1b"></td>
            <td id="bs-stat-away-2b"></td>
            <td id="bs-stat-away-3b"></td>
            <td id="bs-stat-away-hr"></td>
          </tr>
          <tr>
            <td class="stat-team" id="bs-stat-home-name"></td>
            <td class="stat-hits" id="bs-stat-home-hits"></td>
            <td class="stat-err"  id="bs-stat-home-errors"></td>
            <td id="bs-stat-home-k"></td>
            <td id="bs-stat-home-lob"></td>
            <td id="bs-stat-home-1b"></td>
            <td id="bs-stat-home-2b"></td>
            <td id="bs-stat-home-3b"></td>
            <td id="bs-stat-home-hr"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- At bat / On deck -->
    <div class="batting-banners" id="bs-batting-banners"></div>

  </div>

  <!-- ── UMP VIEW (field actions) ─────────────────────── -->
  <div class="view" id="view-ump">

    <!-- Live BSO count -->
    <div class="ctrl-section">
      <div class="ctrl-header">Count</div>
      <div class="ump-bso" id="ump-bso-display"></div>
    </div>

    <!-- Main ump buttons -->
    <div class="ctrl-section">
      <div class="ctrl-header">Pitch / Play</div>
      <div class="ctrl-row">
        <button class="btn-big btn-ball"   onclick="api('ball')">Ball</button>
        <button class="btn-big btn-strike" onclick="api('strike')">Strike</button>
        <button class="btn-big btn-foul"   onclick="api('foul')">Foul</button>
        <button class="btn-big btn-out"    onclick="api('out')">Out</button>
      </div>
      <div class="ctrl-row" style="margin-top:4px;">
        <button class="btn" onclick="api('count/reset')">Reset Count</button>
        <button class="btn" onclick="api('change-sides')" style="border-color:var(--accent);color:var(--accent);">Change Sides</button>
      </div>
    </div>

    <!-- Scoring -->
    <div class="ctrl-section">
      <div class="ctrl-header">Scoring</div>
      <div class="ctrl-row" style="align-items:center; gap:12px;">
        <button class="btn-big btn-run" id="ump-run-btn" onclick="api('run')">+1 Run</button>
        <button class="btn"             onclick="api('run', {delta: -1})">−1 Run</button>
        <span id="ump-score-display" style="font-family:'Orbitron',monospace; font-size:20px; color:var(--text-bright); margin-left:8px;"></span>
      </div>
    </div>

    <!-- Bases (tappable diamond) -->
    <div class="ctrl-section">
      <div class="ctrl-header">Bases</div>
      <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
        <div class="ump-diamond">
          <div class="base-empty"></div>
          <div class="ump-base" id="ump-base-2nd" onclick="toggleBase('second')"></div>
          <div class="base-empty"></div>
          <div class="ump-base" id="ump-base-3rd" onclick="toggleBase('third')"></div>
          <div class="base-empty"></div>
          <div class="ump-base" id="ump-base-1st" onclick="toggleBase('first')"></div>
          <div class="base-empty"></div>
          <div class="ump-base home-plate"></div>
          <div class="base-empty"></div>
        </div>
        <button class="btn" onclick="clearBases()">Clear Bases</button>
      </div>
    </div>

    <!-- Hits -->
    <div class="ctrl-section">
      <div class="ctrl-header" id="ump-hits-header">Hits</div>
      <div class="ctrl-row">
        <button class="btn-big btn-hit" onclick="recordHit('singles')">1B</button>
        <button class="btn-big btn-hit" onclick="recordHit('doubles')">2B</button>
        <button class="btn-big btn-hit" onclick="recordHit('triples')">3B</button>
        <button class="btn-big btn-hr"  onclick="recordHit('hrs')">HR</button>
      </div>
    </div>

    <!-- Other stats -->
    <div class="ctrl-section">
      <div class="ctrl-header">Other Stats</div>
      <div class="ctrl-row">
        <button class="btn" onclick="recordBattingStat('strikeouts', 1)">+K</button>
        <button class="btn" onclick="recordBattingStat('strikeouts', -1)">−K</button>
        <button class="btn" onclick="recordBattingStat('lob', 1)">+LOB</button>
        <button class="btn" onclick="recordBattingStat('lob', -1)">−LOB</button>
        <button class="btn btn-err" onclick="recordFieldingError()">+Error</button>
        <button class="btn btn-err" onclick="recordFieldingError(-1)">−Error</button>
      </div>
    </div>

  </div>

  <!-- ── CONTROL VIEW (scorekeeper) ────────────────────── -->
  <div class="view" id="view-control">

    <!-- Score correction -->
    <div class="ctrl-section">
      <div class="ctrl-header">Score Correction</div>
      <div class="ctrl-row inning-edit-row">
        <span style="font-size:12px;color:var(--text-dim);">Inning</span>
        <input class="inning-edit-input" id="edit-inning" type="number" min="1" value="1">
        <span style="font-size:12px;color:var(--text-dim);">Half</span>
        <select id="edit-half" class="inning-edit-input" style="width:auto">
          <option value="top">Top (Away)</option>
          <option value="bottom">Bottom (Home)</option>
        </select>
        <span style="font-size:12px;color:var(--text-dim);">Runs</span>
        <input class="inning-edit-input" id="edit-runs" type="number" value="0">
        <button class="btn-primary" onclick="setInningScore()">Set</button>
        <button class="btn" onclick="setInningDash()" title="Set to dash (–)">–</button>
      </div>
    </div>

    <!-- Inning navigation -->
    <div class="ctrl-section">
      <div class="ctrl-header">Navigate</div>
      <div class="ctrl-row">
        <span style="font-size:12px;color:var(--text-dim);">Jump to</span>
        <input class="inning-edit-input" id="nav-inning" type="number" min="1" value="1" style="width:52px;">
        <select id="nav-half" class="inning-edit-input" style="width:auto">
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
        </select>
        <button class="btn" onclick="navInning()">Go</button>
      </div>
      <div class="ctrl-row" style="margin-top:4px;">
        <button class="btn" onclick="api('inning/add')">+ Inning</button>
        <button class="btn" onclick="api('inning/remove')" style="color:var(--accent);border-color:var(--accent);">− Inning</button>
      </div>
    </div>

    <!-- BSO display style -->
    <div class="ctrl-section">
      <div class="ctrl-header">BSO Display Style</div>
      <div class="ctrl-row">
        <button class="btn" id="style-dots"    onclick="setBsoStyle('dots')">Dots</button>
        <button class="btn" id="style-numbers" onclick="setBsoStyle('numbers')">Numbers</button>
        <button class="btn" id="style-both"    onclick="setBsoStyle('both')">Both</button>
      </div>
    </div>

    <!-- Team names -->
    <div class="ctrl-section">
      <div class="ctrl-header">Team Names</div>
      <div class="ctrl-row">
        <span style="font-size:12px;color:var(--text-dim);">Away</span>
        <input class="team-name-input" id="edit-away" type="text" maxlength="20" placeholder="Away">
        <span style="font-size:12px;color:var(--text-dim);">Home</span>
        <input class="team-name-input" id="edit-home" type="text" maxlength="20" placeholder="Home">
        <button class="btn-primary" onclick="saveTeamNames()">Save</button>
      </div>
    </div>

    <!-- Game status -->
    <div class="ctrl-section">
      <div class="ctrl-header">Game Status</div>
      <div class="ctrl-row">
        <button class="btn" id="status-active" onclick="setStatus('active')">Active</button>
        <button class="btn" id="status-final"  onclick="setStatus('final')" style="color:var(--accent);border-color:var(--accent);">Final</button>
      </div>
    </div>

    <!-- At bat / Next up -->
    <div class="ctrl-section">
      <div class="ctrl-header">At Bat / On Deck</div>
      <div class="ctrl-row" style="gap:8px; flex-wrap:wrap; align-items:center;">
        <span style="font-size:12px;color:var(--text-dim);min-width:52px;">At Bat</span>
        <input class="batting-input" id="edit-at-bat" type="text" maxlength="40" placeholder="Batter name / #">
        <button class="btn vis-btn" id="btn-at-bat-vis" onclick="toggleBattingVis('at_bat_visible')">Show</button>
      </div>
      <div class="ctrl-row" style="gap:8px; flex-wrap:wrap; align-items:center; margin-top:4px;">
        <span style="font-size:12px;color:var(--text-dim);min-width:52px;">On Deck</span>
        <input class="batting-input" id="edit-next-up" type="text" maxlength="40" placeholder="Next batter / #">
        <button class="btn vis-btn" id="btn-next-up-vis" onclick="toggleBattingVis('next_up_visible')">Show</button>
      </div>
      <div class="ctrl-row" style="margin-top:6px;">
        <button class="btn-primary" onclick="saveBatting()">Save Names</button>
        <button class="btn" onclick="clearBatting()">Clear</button>
      </div>
    </div>

    <!-- Stats correction -->
    <div class="ctrl-section">
      <div class="ctrl-header">Stats Correction</div>
      <div class="ctrl-row">
        <select id="stat-team" class="inning-edit-input" style="width:auto">
          <option value="away">Away</option>
          <option value="home">Home</option>
        </select>
        <select id="stat-name" class="inning-edit-input" style="width:auto">
          <option value="singles">1B</option>
          <option value="doubles">2B</option>
          <option value="triples">3B</option>
          <option value="hrs">HR</option>
          <option value="strikeouts">K</option>
          <option value="lob">LOB</option>
          <option value="errors">E</option>
        </select>
        <button class="btn" onclick="adjustStat(1)">+1</button>
        <button class="btn" onclick="adjustStat(-1)">−1</button>
      </div>
    </div>

  </div>

  <script>
    // ── State ────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');
    let view  = params.get('view') || 'boxscore';
    let state = null;

    // ── Theme ────────────────────────────────────────────
    function applyTheme(t) {
      if (t === 'default') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('mbTheme', t);
      const sel = document.getElementById('theme-select');
      if (sel) sel.value = t;
    }
    (function() { applyTheme(localStorage.getItem('mbTheme') || 'default'); })();

    if (!gameId) { window.location.href = '/'; }

    // ── View switching ───────────────────────────────────
    function switchView(v) {
      view = v;
      const url = new URL(window.location);
      url.searchParams.set('view', v);
      history.replaceState(null, '', url);
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + v).classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + v).classList.add('active');
      if (state) render();
    }

    // ── Polling ──────────────────────────────────────────
    let failCount = 0;

    function setConnStatus(ok) {
      const el = document.getElementById('conn-status');
      if (!el) return;
      if (ok) {
        el.className = 'conn-status connected';
        el.innerHTML = '<span class="conn-dot"></span>Connected';
      } else {
        el.className = 'conn-status lost';
        el.innerHTML = '<span class="conn-dot"></span>Signal Lost';
      }
    }

    async function poll() {
      try {
        const resp = await fetch('/api/baseball/games/' + gameId);
        if (!resp.ok) { failCount++; if (failCount >= 3) setConnStatus(false); return; }
        state = await resp.json();
        failCount = 0;
        setConnStatus(true);
        render();
      } catch (e) { failCount++; if (failCount >= 3) setConnStatus(false); }
    }

    // ── Render ───────────────────────────────────────────
    function render() {
      if (!state) return;
      renderHeader();
      if (view === 'boxscore')  renderBoxscore();
      else if (view === 'ump')  renderUmp();
      else if (view === 'control') renderControl();
    }

    function renderHeader() {
      document.getElementById('header-score').textContent =
        `${state.away_team} ${state.away_total} – ${state.home_total} ${state.home_team}`;
    }

    // ── Box score ─────────────────────────────────────────
    function renderBoxscore() {
      const s = state;
      setText('bs-away-name', s.away_team);
      setText('bs-home-name', s.home_team);
      setText('bs-away-total', s.away_total);
      setText('bs-home-total', s.home_total);

      // Rebuild inning columns
      const headerRow = document.getElementById('bs-header-row');
      const awayRow   = document.getElementById('bs-away-row');
      const homeRow   = document.getElementById('bs-home-row');

      // Clear old inning cells (keep first and last)
      const clearRow = row => {
        while (row.children.length > 2) row.removeChild(row.children[1]);
      };
      clearRow(headerRow);
      clearRow(awayRow);
      clearRow(homeRow);

      for (let i = 0; i < s.num_innings; i++) {
        const isCurrent = (i + 1) === s.current_inning;
        const th = document.createElement('th');
        th.textContent = i + 1;
        if (isCurrent) th.style.color = '#4fc3f7';
        headerRow.insertBefore(th, headerRow.lastElementChild);

        const awayScore = s.scores.away[i];
        const homeScore = s.scores.home[i];
        const awayTd = document.createElement('td');
        const homeTd = document.createElement('td');
        awayTd.className = 'bs-inning-score' + (isCurrent ? ' current' : awayScore === null ? ' empty' : '');
        homeTd.className = 'bs-inning-score' + (isCurrent ? ' current' : homeScore === null ? ' empty' : '');
        awayTd.textContent = awayScore === null ? (isCurrent ? '' : '·') : awayScore;
        homeTd.textContent = homeScore === null ? (isCurrent ? '' : '·') : homeScore;
        awayRow.insertBefore(awayTd, awayRow.lastElementChild);
        homeRow.insertBefore(homeTd, homeRow.lastElementChild);
      }

      // Inning / half label
      const halfLabel = s.half === 'top' ? '▲' : '▼';
      const ordinal = ['', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
      const innLabel = ordinal[s.current_inning] || `${s.current_inning}th`;
      if (s.status === 'final') {
        setText('bs-inning-label', 'FINAL');
      } else {
        setText('bs-inning-label', `${halfLabel} ${innLabel}`);
      }

      // BSO
      renderBSO('bs-bso', s);

      // Bases
      document.getElementById('bs-base-1st').classList.toggle('occupied', s.base_first);
      document.getElementById('bs-base-2nd').classList.toggle('occupied', s.base_second);
      document.getElementById('bs-base-3rd').classList.toggle('occupied', s.base_third);

      // Stats mini-table
      setText('bs-stat-away-name', s.away_team);
      setText('bs-stat-home-name', s.home_team);
      setText('bs-stat-away-hits',   s.away_hits);
      setText('bs-stat-home-hits',   s.home_hits);
      setText('bs-stat-away-errors', s.away_errors);
      setText('bs-stat-home-errors', s.home_errors);
      setText('bs-stat-away-k',      s.away_strikeouts);
      setText('bs-stat-home-k',      s.home_strikeouts);
      setText('bs-stat-away-lob',    s.away_lob);
      setText('bs-stat-home-lob',    s.home_lob);
      setText('bs-stat-away-1b',     s.away_singles);
      setText('bs-stat-home-1b',     s.home_singles);
      setText('bs-stat-away-2b',     s.away_doubles);
      setText('bs-stat-home-2b',     s.home_doubles);
      setText('bs-stat-away-3b',     s.away_triples);
      setText('bs-stat-home-3b',     s.home_triples);
      setText('bs-stat-away-hr',     s.away_hrs);
      setText('bs-stat-home-hr',     s.home_hrs);

      // At bat / On deck banners
      const banners = document.getElementById('bs-batting-banners');
      banners.innerHTML = '';
      if (s.at_bat_visible && s.at_bat) {
        const b = document.createElement('div');
        b.className = 'at-bat-banner';
        b.innerHTML = `<span class="batting-label">At Bat</span>${s.at_bat}`;
        banners.appendChild(b);
      }
      if (s.next_up_visible && s.next_up) {
        const d = document.createElement('div');
        d.className = 'on-deck-banner';
        d.innerHTML = `<span class="batting-label">On Deck</span>${s.next_up}`;
        banners.appendChild(d);
      }
    }

    function renderBSO(containerId, s) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const style = s.bso_style;
      const showDots = style === 'dots' || style === 'both';
      const showNums = style === 'numbers' || style === 'both';

      const bsoItems = [
        { label: 'Balls',   val: s.balls,   max: 4, cls: 'ball' },
        { label: 'Strikes', val: s.strikes, max: 3, cls: 'strike' },
        { label: 'Outs',    val: s.outs,    max: 3, cls: 'out' },
      ];

      el.innerHTML = bsoItems.map(item => `
        <div class="bso-group">
          <div class="bso-label">${item.label}</div>
          ${showDots ? `<div class="bso-dots">${
            Array.from({length: item.max}, (_, i) =>
              `<div class="bso-dot${i < item.val ? ` ${item.cls}-on` : ''}"></div>`
            ).join('')
          }</div>` : ''}
          ${showNums ? `<div class="bso-number ${item.cls}-val">${item.val}</div>` : ''}
        </div>
      `).join('');
    }

    // ── Ump view ──────────────────────────────────────────
    function renderUmp() {
      const s = state;
      renderBSOUmp(s);
      document.getElementById('ump-base-1st').classList.toggle('occupied', s.base_first);
      document.getElementById('ump-base-2nd').classList.toggle('occupied', s.base_second);
      document.getElementById('ump-base-3rd').classList.toggle('occupied', s.base_third);
      const battingTeam = s.half === 'top' ? s.away_team : s.home_team;
      setText('ump-run-btn', `+1 Run (${battingTeam})`);
      setText('ump-score-display', `A: ${s.away_total}  H: ${s.home_total}`);
      setText('ump-hits-header', `Hits — ${battingTeam}`);
    }

    function renderControl() {
      const s = state;
      ['dots', 'numbers', 'both'].forEach(sty => {
        const btn = document.getElementById('style-' + sty);
        if (btn) { btn.style.borderColor = s.bso_style === sty ? 'var(--accent)' : ''; btn.style.color = s.bso_style === sty ? 'var(--accent)' : ''; }
      });
      const awayIn = document.getElementById('edit-away');
      const homeIn = document.getElementById('edit-home');
      if (awayIn && document.activeElement !== awayIn) awayIn.value = s.away_team;
      if (homeIn && document.activeElement !== homeIn) homeIn.value = s.home_team;
      const sa = document.getElementById('status-active');
      const sf = document.getElementById('status-final');
      if (sa) { sa.style.borderColor = s.status === 'active' ? '#2ecc71' : ''; sa.style.color = s.status === 'active' ? '#2ecc71' : ''; }
      if (sf) { sf.style.borderColor = s.status === 'final' ? 'var(--accent)' : ''; sf.style.color = s.status === 'final' ? 'var(--accent)' : ''; }

      // At bat / next up
      const abIn = document.getElementById('edit-at-bat');
      const nuIn = document.getElementById('edit-next-up');
      if (abIn && document.activeElement !== abIn) abIn.value = s.at_bat;
      if (nuIn && document.activeElement !== nuIn) nuIn.value = s.next_up;
      _syncVisBtn('btn-at-bat-vis',  s.at_bat_visible);
      _syncVisBtn('btn-next-up-vis', s.next_up_visible);
    }

    function _syncVisBtn(id, visible) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.textContent = visible ? 'Visible' : 'Hidden';
      btn.classList.toggle('hidden-state', !visible);
    }

    function renderBSOUmp(s) {
      const el = document.getElementById('ump-bso-display');
      if (!el) return;
      const style = s.bso_style;
      const showDots = style === 'dots' || style === 'both';
      const showNums = style === 'numbers' || style === 'both';

      const items = [
        { label: 'B', val: s.balls,   max: 4, cls: 'ball',   color: '#3498db' },
        { label: 'S', val: s.strikes, max: 3, cls: 'strike', color: '#f39c12' },
        { label: 'O', val: s.outs,    max: 3, cls: 'out',    color: '#e94560' },
      ];

      el.innerHTML = items.map(item => `
        <div class="ump-bso-item">
          <div class="ump-bso-label">${item.label}</div>
          ${showNums ? `<div class="ump-bso-val" style="color:${item.color}">${item.val}</div>` : ''}
          ${showDots ? `<div class="ump-bso-dots">${
            Array.from({length: item.max}, (_, i) =>
              `<div class="ump-bso-dot${i < item.val ? ' on' : ''}" style="${i < item.val ? `background:${item.color};border-color:${item.color}` : ''}"></div>`
            ).join('')
          }</div>` : ''}
        </div>
      `).join('');
    }

    // ── API helpers ──────────────────────────────────────
    async function api(endpoint, body = null) {
      const opts = { method: 'PATCH' };
      if (body !== null) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      const resp = await fetch(`/api/baseball/games/${gameId}/${endpoint}`, opts);
      if (resp.ok) { state = await resp.json(); render(); }
    }

    // ── Actions ──────────────────────────────────────────
    async function toggleBase(which) {
      if (!state) return;
      const map = { first: state.base_first, second: state.base_second, third: state.base_third };
      map[which] = !map[which];
      await api('bases', { first: map.first, second: map.second, third: map.third });
    }

    async function clearBases() {
      await api('bases', { first: false, second: false, third: false });
    }

    async function setInningScore() {
      const inning = parseInt(document.getElementById('edit-inning').value);
      const half   = document.getElementById('edit-half').value;
      const runs   = parseInt(document.getElementById('edit-runs').value);
      if (isNaN(inning) || isNaN(runs)) return;
      await api('inning-score', { inning, half, runs });
    }

    async function setInningDash() {
      const inning = parseInt(document.getElementById('edit-inning').value);
      const half   = document.getElementById('edit-half').value;
      if (isNaN(inning)) return;
      await api('inning-score', { inning, half, runs: null });
    }

    async function navInning() {
      const inning = parseInt(document.getElementById('nav-inning').value);
      const half   = document.getElementById('nav-half').value;
      if (isNaN(inning)) return;
      await api('inning', { inning, half });
    }

    async function setBsoStyle(style) {
      await api('bso-style', { style });
    }

    async function saveTeamNames() {
      const home_team = document.getElementById('edit-home').value.trim();
      const away_team = document.getElementById('edit-away').value.trim();
      if (!home_team && !away_team) return;
      const body = {};
      if (home_team) body.home_team = home_team;
      if (away_team) body.away_team = away_team;
      await api('teams', body);
    }

    async function setStatus(status) {
      await api('status', { status });
    }

    // ── Stat recording ───────────────────────────────────
    function _battingTeam() {
      return state && state.half === 'top' ? 'away' : 'home';
    }
    function _fieldingTeam() {
      return state && state.half === 'top' ? 'home' : 'away';
    }

    async function recordHit(stat) {
      if (!state) return;
      await api('stat', { team: _battingTeam(), stat, delta: 1 });
    }

    async function recordBattingStat(stat, delta) {
      if (!state) return;
      await api('stat', { team: _battingTeam(), stat, delta });
    }

    async function recordFieldingError(delta = 1) {
      if (!state) return;
      await api('stat', { team: _fieldingTeam(), stat: 'errors', delta });
    }

    async function adjustStat(delta) {
      const team = document.getElementById('stat-team').value;
      const stat = document.getElementById('stat-name').value;
      await api('stat', { team, stat, delta });
    }

    // ── Batting order ────────────────────────────────────
    async function saveBatting() {
      const at_bat  = document.getElementById('edit-at-bat').value.trim();
      const next_up = document.getElementById('edit-next-up').value.trim();
      await api('batting', { at_bat, next_up });
    }

    async function clearBatting() {
      await api('batting', { at_bat: '', next_up: '' });
    }

    async function toggleBattingVis(field) {
      if (!state) return;
      await api('batting', { [field]: !state[field] });
    }

    // ── DOM helpers ──────────────────────────────────────
    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    }

    // ── Init ─────────────────────────────────────────────
    switchView(view);
    poll();
    setInterval(poll, 200);
  </script>
</body>
</html>
